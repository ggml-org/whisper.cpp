# CI for the parakeet engine (engines/parakeet/ — moved from parakeet-cpp/
# by the repo reorg QIP, PR 1).
#
# Scope (QIP "PR 0" lane): build the engine + every test harness against
# system ggml (qvac-ext-ggml @ speech, the same fork the ggml-speech vcpkg
# port ships), then run the non-GPU ctest suites. Tests whose model/reference
# fixtures aren't present are registered as DISABLED by the CMakeLists and
# show up as "Not Run" — the lane stays green with the committed fixtures
# only. GPU suites (`ctest -L gpu`) need real GPUs → self-hosted lane, see
# the gpu job at the bottom.
name: parakeet CI

on:
  push:
    branches: [master]
    paths:
      - 'engines/parakeet/**'
      - 'engines/test/**'
      - '.github/workflows/parakeet-ci.yml'
  pull_request:
    paths:
      - 'engines/parakeet/**'
      - 'engines/test/**'
      - '.github/workflows/parakeet-ci.yml'
  workflow_dispatch:
    inputs:
      run_gpu:
        description: 'Also run the GPU ctest lane (on the self-hosted NVIDIA Linux runner)'
        type: boolean
        default: false

permissions:
  contents: read

# Dedupe per PR and per branch: a re-push or re-dispatch supersedes the
# in-flight run. The guard below previously excluded every event but
# pull_request, so a push or a re-dispatch stacked a second run instead of
# replacing the first.
#
# Two things are exempt and keyed per run instead, so they can never be
# superseded:
#
#   run_gpu dispatch - the opt-in `gpu` job below only runs under a
#     workflow_dispatch with run_gpu, takes ~90 minutes on a self-hosted
#     runner, and is SKIPPED by whatever run would replace it. Since that
#     dispatch is made on a branch rather than master, keying on the ref alone
#     left it cancellable — a second dispatch would kill it and the
#     replacement would not re-run `gpu`, silently losing the result.
#   master - so a merged commit always gets a CI verdict.
#
# github.event.inputs.* is a string even for a `type: boolean` input, hence
# the explicit == 'true'.
concurrency:
  group: parakeet-ci-${{ ((github.event.inputs.run_gpu == 'true' || github.ref == 'refs/heads/master') && github.run_id) || github.ref }}
  cancel-in-progress: true

env:
  GGML_REPO: https://github.com/tetherto/qvac-ext-ggml.git
  GGML_BRANCH: speech # keep in sync with engines/parakeet/scripts/setup-ggml.sh

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  build-test:
    needs: runner_names
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os == 'macos-14' && needs.runner_names.outputs.macos_14 || needs.runner_names.outputs.ubuntu_2404 }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Test converter arguments
        run: python3 -m unittest engines/parakeet/test/test_converter_args.py

      - name: Install ccache
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ccache; else sudo apt-get update -q && sudo apt-get install -y ccache; fi
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"

      - name: Resolve ggml pin (tip of ${{ env.GGML_BRANCH }})
        id: ggml
        run: echo "sha=$(git ls-remote "$GGML_REPO" "refs/heads/$GGML_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache ggml install
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: ggml-install
          key: ggml-install-portable-${{ matrix.os }}-${{ steps.ggml.outputs.sha }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-parakeet-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-parakeet-${{ matrix.os }}-

      # CPU-only ggml: this lane runs `-LE gpu` tests, and hosted runners
      # have no Vulkan/OpenCL; Metal is exercised by the gpu lane instead.
      - name: Build ggml (system ggml, qvac-ext-ggml@${{ env.GGML_BRANCH }})
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        run: |
          # Fetch the exact SHA the cache key was derived from — the branch
          # tip may have advanced since the ls-remote resolution, and a
          # tip-only shallow clone would then silently build (and cache)
          # a different commit than the key claims.
          git init -q ggml-src
          git -C ggml-src remote add origin "$GGML_REPO"
          git -C ggml-src fetch --depth 1 origin ${{ steps.ggml.outputs.sha }}
          git -C ggml-src checkout -q FETCH_HEAD
          cmake -S ggml-src -B ggml-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=OFF \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/ggml-install"
          cmake --build ggml-src/build -j4
          cmake --install ggml-src/build

      - name: Configure
        run: |
          cmake -S engines/parakeet -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPARAKEET_USE_SYSTEM_GGML=ON \
            -DPARAKEET_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$PWD/ggml-install"

      - name: Build
        run: cmake --build build -j4

      # Excludes gpu (no GPU on hosted runners) and perf (timing gates are
      # meaningless on shared runners). Model-dependent tests are DISABLED
      # at configure time when fixtures are absent and report as "Not Run".
      # LD_LIBRARY_PATH: the ggml install ships libqvac-speech-ggml.so whose
      # own dependency on the ggml-cpu/base siblings is resolved transitively
      # — Linux RUNPATH doesn't apply to transitive loads, so the loader
      # needs the directory explicitly (macOS @rpath chains handle it).
      - name: Test (non-GPU)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ggml-install/lib
        run: ctest --test-dir build -LE 'gpu|perf' --output-on-failure --timeout 600

      # Guards the *installed* artifact contract, which no in-tree ctest
      # can see: the qvac-parakeet package/target names, a static-only
      # install with no dead bin/ reference, a self-sufficient .pc
      # (including Libs.private for the PRIVATE OpenMP / Core ML deps —
      # OpenMP is found on the ubuntu runner, so this lane is where that
      # path is exercised), and the absence of any bare-`parakeet`
      # artifact that would collide with upstream whisper.cpp's own
      # parakeet in a shared vcpkg prefix.
      - name: Package-consumption contract (find_package + pkg-config)
        run: |
          bash engines/parakeet/scripts/test-package-consumption.sh \
            --ggml-prefix "$PWD/ggml-install"

  # Non-Metal GPU lane, opt-in via run_gpu. Runner choice mirrors tts-ci.yml:
  # the generic [self-hosted, gpu] label resolves to a mixed pool — an Apple
  # Silicon host whose Vulkan loader is absent from the test rpath, and a
  # Windows host whose default PowerShell breaks this bash run script — so
  # pin the NVIDIA Linux runner the qvac monorepo's benchmark and e2e lanes
  # use (it exposes nvidia-smi and a Vulkan ICD).
  gpu:
    needs: runner_names
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu
    runs-on: ${{ needs.runner_names.outputs.linux_x64_gpu }}
    timeout-minutes: 90
    steps:
      # Self-hosted runners are persistent, so the previous job's tree can
      # survive into this one (docs/ci/SELF-HOSTED-RUNNERS.md in the qvac
      # monorepo). This job is self-hosted-only, so no hosted-runner guard.
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
      - uses: actions/checkout@v4
      - name: Show what this runner has
        run: |
          uname -a
          nvidia-smi || echo "no NVIDIA driver"
          command -v nvcc && nvcc --version || echo "no CUDA toolkit on PATH"
          ls /usr/local/cuda*/bin/nvcc 2>/dev/null || echo "no /usr/local/cuda*"
          command -v vulkaninfo && vulkaninfo --summary 2>/dev/null | head -20 || echo "no vulkaninfo"
      # GGML_VULKAN=ON is the backend the -L gpu suites primarily target
      # (test_vk_vs_cpu et al). CUDA is added only where a toolkit exists —
      # requesting it without one fails the configure outright. A CPU-only
      # ggml would skip or falsely pass the GPU suites.
      - name: Build ggml + engine (native backends)
        run: |
          git clone --depth 1 --branch "$GGML_BRANCH" "$GGML_REPO" ggml-src
          CUDA_OPTION=""
          if command -v nvcc >/dev/null 2>&1 || [ -x /usr/local/cuda/bin/nvcc ]; then
            NVCC_PATH=$(command -v nvcc || echo /usr/local/cuda/bin/nvcc)
            CUDA_OPTION="-DGGML_CUDA=ON -DCMAKE_CUDA_COMPILER=$NVCC_PATH"
            echo "CUDA toolkit found at $NVCC_PATH; building the NVIDIA backend as well"
          else
            echo "::notice::no CUDA toolkit on this runner; the CUDA arms cannot run here"
          fi
          # GGML_BUILD_TESTS=OFF as every other ggml build in this repo does:
          # this lane runs the *engine's* ctest suite, never ggml's, so
          # compiling ggml's tests only spends runner time and couples the
          # lane to breakage in code it does not exercise.
          cmake -S ggml-src -B ggml-src/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGGML_VULKAN=ON \
            $CUDA_OPTION \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/ggml-install"
          cmake --build ggml-src/build -j && cmake --install ggml-src/build
          cmake -S engines/parakeet -B build -DCMAKE_BUILD_TYPE=Release \
            -DPARAKEET_USE_SYSTEM_GGML=ON -DPARAKEET_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$PWD/ggml-install"
          cmake --build build -j
      # `ctest -L gpu` is green when every arm is DISABLED (missing model or
      # reference fixtures), so a bare pass cannot be told apart from "nothing
      # executed" — same reason tts-ci.yml carries this step. Reported rather
      # than enforced, matching tts-ci: no engine's fixtures are hosted in CI
      # today, so hosting them is a change for the whole repo to make, not for
      # this lane to block on. Unlike tts-ci's fixed list, the arms are read
      # from ctest's own listing: parakeet has a dozen fixture-gated gpu arms
      # and the set changes as decoders are added.
      - name: Report which GPU arms are runnable
        run: |
          python3 - <<'CHECK'
          import json, subprocess, sys

          listing = subprocess.run(
              ["ctest", "--test-dir", "build", "-N", "--show-only=json-v1"],
              capture_output=True, text=True, check=True).stdout
          tests = json.loads(listing)["tests"]

          arms = []
          for test in tests:
              properties = {p["name"]: p["value"] for p in test.get("properties", [])}
              if "gpu" in (properties.get("LABELS") or []):
                  arms.append((test["name"], bool(properties.get("DISABLED"))))

          disabled = [name for name, off in arms if off]
          runnable = [name for name, off in arms if not off]
          for name in disabled:
              print("::warning::%s is disabled (its model or reference fixture is missing)" % name)
          if not arms:
              print("::warning::no gpu-labeled tests are registered in this build")
          elif not runnable:
              print("::warning::all %d GPU arms are disabled — the ctest step below will execute nothing, so its pass proves nothing" % len(arms))
          else:
              print("%d of %d GPU arms are runnable" % (len(runnable), len(arms)))
          sys.exit(0)
          CHECK
      # LD_LIBRARY_PATH: libqvac-speech-ggml.so resolves its ggml-cpu/base
      # siblings transitively, and Linux RUNPATH doesn't apply to transitive
      # loads, so the loader needs the directory explicitly.
      - name: Run the GPU suites
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ggml-install/lib
        run: ctest --test-dir build -L gpu --output-on-failure --timeout 1200
